<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarmoq xavfsizligi – yakuniy nazorat</title>
<style>
:root{--bg:#f5f6fa;--card:#ffffff;--fg:#1b1f2a;--mut:#667085;--line:#e4e7ec;--acc:#4f46e5;--acc-soft:rgba(79,70,229,.10);--ok:#047857;--okbg:#ecfdf5;--okline:#34d399;--bad:#b91c1c;--badbg:#fef2f2;--badline:#f87171;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06)}
:root.dark{--bg:#0e1116;--card:#171b23;--fg:#e7e9ef;--mut:#98a2b3;--line:#272d39;--acc:#818cf8;--acc-soft:rgba(129,140,248,.14);--ok:#6ee7b7;--okbg:rgba(52,211,153,.12);--okline:#34d399;--bad:#fca5a5;--badbg:rgba(248,113,113,.12);--badline:#f87171;--sh:none}
@media (prefers-color-scheme:dark){:root:not(.light){--bg:#0e1116;--card:#171b23;--fg:#e7e9ef;--mut:#98a2b3;--line:#272d39;--acc:#818cf8;--acc-soft:rgba(129,140,248,.14);--ok:#6ee7b7;--okbg:rgba(52,211,153,.12);--okline:#34d399;--bad:#fca5a5;--badbg:rgba(248,113,113,.12);--badline:#f87171;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-weight:700;font-size:1.05rem;margin:0}
.theme{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1.1rem;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex:1}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-size:.92rem;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
.controls{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.topics{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.topics::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 13px;border-radius:999px;font-size:.87rem;white-space:nowrap}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:14px 0 8px}
.bar>div{height:100%;background:var(--acc);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.86rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh)}
.tag{display:inline-block;font-size:.76rem;color:var(--acc);background:var(--acc-soft);padding:3px 9px;border-radius:999px;margin-bottom:10px;font-weight:600}
.q{font-size:1.08rem;font-weight:650;margin:0 0 16px;line-height:1.45}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 14px;margin:0 0 9px;border:1px solid var(--line);background:var(--bg);border-radius:13px;min-height:50px;font-size:1rem;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mut)}
.opt:not(:disabled):hover{border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--okline);background:var(--okbg)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--badline);background:var(--badbg)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.feed{margin:12px 0 0;padding:12px 14px;border-radius:12px;font-weight:600}
.feed.ok{background:var(--okbg);color:var(--ok)}
.feed.bad{background:var(--badbg);color:var(--bad)}
.answer{margin-top:4px;padding:16px;border-radius:14px;background:var(--okbg);border:1px solid var(--okline)}
.answer .lbl{font-size:.8rem;color:var(--ok);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.answer .txt{font-size:1.05rem;font-weight:600}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;padding:13px 16px;border-radius:13px;font-weight:650;font-size:.98rem;border:1px solid var(--line);background:var(--card);color:var(--fg);min-height:48px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.again{background:var(--badbg);border-color:var(--badline);color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}
.hide{display:none!important}
.sum{text-align:center;padding:26px 12px}
.sum .big{font-size:2.8rem;font-weight:800;color:var(--acc);margin:6px 0}
.sum .pct{color:var(--mut);margin-bottom:18px}
.stats{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-size:1.2rem}
.stat span{font-size:.8rem;color:var(--mut)}
.sum .actions{justify-content:center}
.empty{text-align:center;color:var(--mut);padding:30px}
.hint{font-size:.8rem;color:var(--mut);margin-top:14px;text-align:center}
@media (max-width:480px){
 .q{font-size:1.02rem}
 .card{padding:16px;border-radius:16px}
 .btn{min-width:0;flex:1 1 45%}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1 class="title">Tarmoq xavfsizligi</h1>
  <button class="theme" id="theme" aria-label="Mavzu almashtirish" title="Dark / Light">🌙</button>
</div></header>

<main class="wrap">
  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-mode="test" class="on">Test</button>
      <button data-mode="flash">Kartochka</button>
    </div>
    <div class="seg" id="orderSeg">
      <button data-order="seq" class="on">Ketma-ket</button>
      <button data-order="shuf">Aralash</button>
    </div>
  </div>
  <div class="topics" id="topics"></div>
  <div id="stage"></div>
  <div class="hint" id="hint"></div>
</main>

<script>
const DATA = [{"i": 0, "t": "Tarmoq asoslari va protokollar", "q": "Elektron tarmoqlarning asosiy afzalligi nimadan iborat?", "o": ["Axborotni faqat lokal kompyuterda saqlash va ishlov berish", "Resurslarni umumlashtirish va ma'lumot almashishni tezlashtirish", "Foydalanuvchilar sonini cheklab, xavfsizlikni oshirish", "Qurilmalar orasidagi masofani qisqartirib, narxni oshirish"], "a": 1}, {"i": 1, "t": "Tarmoq asoslari va protokollar", "q": "ACL ro'yxatlarining asosiy vazifasi nimadan iborat?", "o": ["Qurilmalarga IP-manzillarni avtomatik taqsimlab berish", "Marshrutlash jadvalini qo'shnilar bilan yangilab turish", "Paketlarni manzil va port bo'yicha ruxsat etish yoki taqiqlash", "Foydalanuvchi parollarini shifrlab saqlash va tekshirish"], "a": 2}, {"i": 2, "t": "Tarmoq asoslari va protokollar", "q": "Tarmoqda QoS mexanizmi nima maqsadda qo'llaniladi?", "o": ["Muhim trafikka ustuvorlik berib, xizmat sifatini kafolatlash", "Barcha trafikni shifrlab, uzatish xavfsizligini ta'minlash", "Qurilmalar orasidagi kabel masofasini jismonan oshirish", "Zararli dasturlarni aniqlab, tarmoqdan olib tashlash"], "a": 0}, {"i": 3, "t": "Tarmoq asoslari va protokollar", "q": "ARPANET tarmog'ida birinchi aloqa seansi qaysi yilda amalga oshirilgan?", "o": ["1957-yilda", "1983-yilda", "1991-yilda", "1969-yilda"], "a": 3}, {"i": 4, "t": "Tarmoq asoslari va protokollar", "q": "AAA modeli qanday uchta asosiy funksiyani o'z ichiga oladi?", "o": ["Autentifikatsiya, shifrlash va zaxira nusxa olish", "Autentifikatsiya, avtorizatsiya va hisobga olish (accounting)", "Avtorizatsiya, marshrutlash va trafikni filtrlash", "Identifikatsiya, arxivlash va ma'lumotlarni siqish"], "a": 1}, {"i": 5, "t": "Tarmoq asoslari va protokollar", "q": "Paketli kommutatsiyaning muhim afzalligi nimadan iborat?", "o": ["Har bir aloqa uchun alohida kanal band qilinishi", "Barcha paketlar doim bir xil yo'ldan ketishi", "Bitta kanaldan ko'p foydalanuvchi samarali foydalanishi", "Kechikish va yo'qotishlar butunlay bo'lmasligi"], "a": 2}, {"i": 6, "t": "Tarmoq asoslari va protokollar", "q": "TCP protokolining qaysi xususiyati to'g'ri ko'rsatilgan?", "o": ["Ulanishsiz ishlaydi va yetkazishni kafolatlamaydi", "Faqat real vaqtli ovoz va video uchun mo'ljallangan", "Sarlavhasi juda kichik, nazorat mexanizmlari mavjud emas", "Ulanish o'rnatadi, tartib va yetkazib berishni kafolatlaydi"], "a": 3}, {"i": 7, "t": "Tarmoq asoslari va protokollar", "q": "TCP ulanishini o'rnatishda qaysi mexanizmdan foydalaniladi?", "o": ["Ikki bosqichli: faqat SYN va ACK yuborish", "Uch bosqichli: SYN, SYN-ACK, ACK almashinuvi", "To'rt bosqichli: FIN, ACK, FIN, ACK almashinuvi", "Bir bosqichli: faqat bitta SYN so'rov yuborish"], "a": 1}, {"i": 8, "t": "Tarmoq asoslari va protokollar", "q": "UDP protokoli ko'pincha qaysi holatda qo'llaniladi?", "o": ["Real vaqtli video, ovoz va DNS so'rovlarida", "Fayllarni to'liq va xatosiz yuklab olishda", "Elektron pochta xabarlarini ishonchli yuborishda", "Veb-sahifani xavfsiz HTTPS orqali ochishda"], "a": 0}, {"i": 9, "t": "Tarmoq asoslari va protokollar", "q": "IP-manzil tarmoqdagi qurilma uchun qanday vazifani bajaradi?", "o": ["Qurilmaning jismoniy ulanish tezligini belgilaydi", "Uzatilayotgan trafikni shifrlab himoya qiladi", "Qurilmani tarmoqda noyob identifikatsiyalab manzillaydi", "Kadrlarni kommutator portlariga yo'naltirib beradi"], "a": 2}, {"i": 10, "t": "Tarmoq asoslari va protokollar", "q": "IP-manzillar makonini quyi tarmoqlarga ajratishning asosiy maqsadi nima?", "o": ["Internet tezligini oshirish va kanalni kengaytirish", "IP-manzillarni shifrlab, xavfsiz saqlashni ta'minlash", "Qurilmalar sonini cheklab, narxni kamaytirishga erishish", "Tarmoqni mantiqiy bo'lib, manzillarni tejash va boshqarish"], "a": 3}, {"i": 11, "t": "Tarmoq asoslari va protokollar", "q": "Ma'lumotlarni inkapsulyatsiya qilish jarayonida nima sodir bo'ladi?", "o": ["Har bir sathda ma'lumotga o'z sarlavhasi qo'shiladi", "Ma'lumot shifrdan chiqarilib, asl holiga qaytariladi", "Bir nechta paket birlashtirilib, bitta paket qilinadi", "Ma'lumot arxivlanib, hajmi kichraytiriladi"], "a": 0}, {"i": 12, "t": "Tarmoq asoslari va protokollar", "q": "SDN yondashuvining asosiy xususiyati nimadan iborat?", "o": ["Boshqaruv va uzatish sathlari bir qurilmada birlashadi", "Faqat simsiz tarmoqlarda ishlashga mo'ljallangan bo'ladi", "Barcha marshrutizatorlar tarmoqdan butunlay chiqarib tashlanadi", "Boshqaruv sathi uzatish sathidan ajratilib, markazlashtiriladi"], "a": 3}, {"i": 13, "t": "Tarmoq asoslari va protokollar", "q": "Marshrutizator paketni uzatish yo'lini nima asosida tanlaydi?", "o": ["Kadr ichidagi MAC-manzillar jadvali yozuvlari asosida", "Paketning umumiy hajmi va yuborilish vaqti asosida", "Maqsad IP-manzil bo'yicha marshrutlash jadvaliga qarab", "Qabul qiluvchi qurilma nomi va huquqi asosida"], "a": 2}, {"i": 14, "t": "Tarmoq asoslari va protokollar", "q": "Statik marshrutlashning asosiy xususiyati nimadan iborat?", "o": ["Marshrutlar qo'shnilar bilan almashib, avtomatik yangilanadi", "Marshrutlar administrator tomonidan qo'lda kiritiladi", "Eng qisqa yo'l algoritm yordamida o'zi hisoblanadi", "Tarmoq o'zgarsa, marshrutlar darhol qayta quriladi"], "a": 1}, {"i": 15, "t": "Tarmoq asoslari va protokollar", "q": "OSPF eng qisqa yo'lni hisoblash uchun qaysi algoritmdan foydalanadi?", "o": ["Dijkstra algoritmi (SPF, eng qisqa yo'l)", "Bellman-Ford algoritmi (masofa vektori)", "Kruskal algoritmi (minimal qamrovchi daraxt)", "DUAL algoritmi (diffuzli yangilanish)"], "a": 0}, {"i": 16, "t": "Tarmoq asoslari va protokollar", "q": "EIGRP protokoli marshrutlarni hisoblash uchun qaysi algoritmdan foydalanadi?", "o": ["Dijkstra algoritmi (SPF, eng qisqa yo'l)", "Bellman-Ford algoritmi (masofa vektori)", "Kruskal algoritmi (minimal qamrovchi daraxt)", "DUAL algoritmi (diffuzli yangilanish)"], "a": 3}, {"i": 17, "t": "Tarmoq asoslari va protokollar", "q": "Ikkinchi sath kommutatori MAC-manzillar jadvalini qanday shakllantiradi?", "o": ["Administrator har bir yozuvni qo'lda kiritib chiqadi", "Kelgan kadrlarning manba MAC-manzilini port bilan bog'laydi", "DHCP serverdan tayyor jadval sifatida yuklab oladi", "Marshrutizatordan marshrutlash jadvalini nusxalab oladi"], "a": 1}, {"i": 18, "t": "Tarmoq asoslari va protokollar", "q": "STP protokolining asosiy vazifasi nima?", "o": ["Kommutatsiya sathida sirtmoqlarni oldini olib, daraxt hosil qilish", "Trafikni shifrlab, uzatish xavfsizligini ta'minlash", "Qurilmalarga IP-manzillarni avtomatik taqsimlab berish", "Foydalanuvchilarni autentifikatsiya qilib, huquq berish"], "a": 0}, {"i": 19, "t": "Tarmoq asoslari va protokollar", "q": "EtherChannel texnologiyasi qanday imkoniyatni taqdim etadi?", "o": ["Portlarni xavfsizlik uchun avtomatik bloklashni", "Marshrutlarni tanlab, tarmoq tezligini oshirishni", "Bir nechta portni birlashtirib, o'tkazuvchanlikni oshirishni", "Manzillarni tarjima qilish va yashirishni"], "a": 2}, {"i": 20, "t": "Tarmoq asoslari va protokollar", "q": "VLAN texnologiyasining asosiy vazifasi nima?", "o": ["Tarmoq trafigini shifrlab, tashqi hujumlardan himoyalash", "Bitta fizik tarmoqni mantiqiy alohida tarmoqlarga bo'lish", "Qurilmalarga IP-manzillarni avtomatik taqsimlab berish", "Bir nechta kommutator portini bitta kanalga birlashtirish"], "a": 1}, {"i": 21, "t": "Tarmoq asoslari va protokollar", "q": "IEEE 802.1Q protokoli Ethernet kadriga nimani qo'shadi?", "o": ["VLAN identifikatorini saqlovchi 4 baytli teg", "Qabul qiluvchining IP-manzilini saqlovchi sarlavha", "Trafikni shifrlovchi qo'shimcha kalit bloki", "Kadr yo'qolsa, uni qayta yuboruvchi hisoblagich"], "a": 0}, {"i": 22, "t": "Tarmoq asoslari va protokollar", "q": "DHCP protokoli qurilmaga qaysi parametrlarni avtomatik ravishda taqdim etadi?", "o": ["Foydalanuvchi logini, paroli va shifrlash kaliti", "MAC-manzil, port raqami va VLAN identifikatori", "Marshrutlash jadvali, ACL qoidalari va QoS sozlamasi", "IP-manzil, subnet maskasi, shlyuz va DNS server"], "a": 3}, {"i": 23, "t": "Tarmoq asoslari va pro : ["Foydalanuvchini tizimga kiritish", "Foydalanuvchiga ruxsat berish", "Parolni xeshlash jarayoni", "Foydalanuvchining qanday harakat qilgani va resurs ishlatilishi haqida yozuv yuritish"], "a": 3}, {"i": 308, "t": "Autentifikatsiya va AAA", "q": "Tarmoq qurilmalarida AAAni amalga oshirish uchun qaysi protokollar qo'llaniladi?", "o": ["Faqat HTTP va HTTPS protokollari", "RADIUS va TACACS+", "Faqat DNS va DHCP protokollari", "Faqat SMTP va POP3 protokollari"], "a": 1}, {"i": 309, "t": "Autentifikatsiya va AAA", "q": "Nima uchun FIDO2 va WebAuthn fishingga bardoshli autentifikatsiya usullari hisoblanadi?", "o": ["Chunki ular parolni elektron pochtaga yuboradi", "Chunki ular foydalanuvchi ismini oshkor qiladi", "Chunki ular faqat ochiq tarmoqlarda ishlaydi", "Chunki kriptografik kalit faqat tegishli veb-domen bilan bog'lanadi va uni soxta saytga yuborib bo'lmaydi"], "a": 3}];
const TOPICS = ["Tarmoq asoslari va protokollar", "Asosiy tushunchalar", "Tahdidlar va hujumlar", "Autentifikatsiya va AAA", "Audit va monitoring", "Bulut va Zero Trust", "VPN va IPsec", "Veb-xavfsizlik", "Tarmoqni avtomatlashtirish va boshqaruv", "Himoya vositalari", "Umumiy"];

const S = {
  mode: "test", order: "seq", topic: null,
  pool: [], pos: 0, score: 0,
  wrong: [],          // test: noto'g'ri savol id lari; kartochka: qaytariladigan id lar
  known: new Set(),   // kartochka: "Bilib oldim" id lari
  answered: false, revealed: false, opts: [], done: false
};

const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Variantlarni har safar tasodifiy aralashtiradi; to'g'ri javob belgisini ham birga olib yuradi
function makeOpts(d){
  return shuffle(d.o.map((txt, i) => ({ txt, correct: i === d.a })));
}

function filtered(){ return DATA.filter(d => !S.topic || d.t === S.topic); }

function startSession(items){
  S.pool = items.slice();
  if (S.order === "shuf") shuffle(S.pool);
  S.pos = 0; S.score = 0; S.wrong = []; S.known = new Set();
  S.answered = false; S.revealed = false; S.done = false;
  render();
}

/* ---------- Yuqori qism: rejim, tartib, mavzu ---------- */
function renderControls(){
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === S.mode));
  document.querySelectorAll("#orderSeg button").forEach(b => b.classList.toggle("on", b.dataset.order === S.order));
  const t = $("#topics"); t.innerHTML = "";
  const mk = (label, val) => {
    const b = el("button", "chip" + (S.topic === val ? " on" : ""), label);
    b.onclick = () => { S.topic = val; startSession(filtered()); };
    t.appendChild(b);
  };
  mk("Barchasi (" + DATA.length + ")", null);
  TOPICS.forEach(g => mk(g + " (" + DATA.filter(d => d.t === g).length + ")", g));
}

/* ---------- Render ---------- */
function render(){
  renderControls();
  const stage = $("#stage"); stage.innerHTML = "";
  $("#hint").textContent = S.mode === "test"
    ? "Klaviatura: 1–4 – javob tanlash, Enter – keyingi"
    : "Klaviatura: Bo'sh joy – javobni ko'rish, 1 – bilib oldim, 2 – yana qaytaraman";
  if (!S.pool.length){ stage.appendChild(el("div", "card empty", "Bu mavzuda savollar yo'q.")); return; }
  if (S.pos >= S.pool.length){ S.done = true; return S.mode === "test" ? renderTestSummary(stage) : renderFlashSummary(stage); }
  S.mode === "test" ? renderTest(stage) : renderFlash(stage);
}

function progress(stage, cur, total){
  const wrap = el("div"); const bar = el("div", "bar"); const fill = el("div"); fill.style.width = (cur / total * 100) + "%";
  bar.appendChild(fill); wrap.appendChild(bar);
  stage.appendChild(wrap);
  return wrap;
}

/* ---------- TEST rejimi ---------- */
function renderTest(stage){
  const d = S.pool[S.pos];
  if (!S.answered) S.opts = makeOpts(d);
  const meta = el("div", "meta");
  meta.appendChild(el("span", null, (S.pos + 1) + " / " + S.pool.length));
  meta.appendChild(el("span", null, "To'g'ri: " + S.score + "  ·  Xato: " + S.wrong.length));
  stage.appendChild(meta);
  progress(stage, S.pos, S.pool.length);

  const card = el("div", "card");
  card.appendChild(el("span", "tag", d.t));
  card.appendChild(el("p", "q", d.q));
  const list = el("div");
  const btns = [];
  S.opts.forEach((o, i) => {
    const b = el("button", "opt");
    b.appendChild(el("span", "k", String(i + 1)));
    b.appendChild(el("span", null, o.txt));
    b.disabled = S.answered;
    b.onclick = () => pickTest(i);
    btns.push(b); list.appendChild(b);
  });
  card.appendChild(list);

  if (S.answered){
    const picked = S._picked;
    const ok = S.opts[picked].correct;
    btns.forEach((b, i) => { if (S.opts[i].correct) b.classList.add("ok"); if (i === picked && !ok) b.classList.add("bad"); });
    card.appendChild(el("div", "feed " + (ok ? "ok" : "bad"), ok ? "To'g'ri!" : "Noto'g'ri. To'g'ri javob belgilandi."));
    const act = el("div", "actions");
    const nx = el("button", "btn primary", S.pos === S.pool.length - 1 ? "Natijani ko'rish" : "Keyingi →");
    nx.onclick = nextTest; act.appendChild(nx);
    card.appendChild(act);
  }
  stage.appendChild(card);
}

function pickTest(i){
  if (S.answered) return;
  S.answered = true; S._picked = i;
  const d = S.pool[S.pos];
  if (S.opts[i].correct) S.score++; else S.wrong.push(d.i);
  render();
}
function nextTest(){ S.pos++; S.answered = false; render(); }

function renderTestSummary(stage){
  const total = S.pool.length, pct = Math.round(S.score / total * 100);
  const card = el("div", "card sum");
  card.appendChild(el("div", null, "Natija"));
  card.appendChild(el("div", "big", S.score + " / " + total));
  card.appendChild(el("div", "pct", pct + "% to'g'ri"));
  const st = el("div", "stats");
  [["To'g'ri", S.score], ["Xato", S.wrong.length], ["Jami", total]].forEach(([l, v]) => {
    const s = el("div", "stat"); s.appendChild(el("b", null, String(v))); s.appendChild(el("span", null, l)); st.appendChild(s);
  });
  card.appendChild(st);
  const act = el("div", "actions");
  if (S.wrong.length){
    const r = el("button", "btn again", "Faqat xato qilingan savollarni qayta ishlash (" + S.wrong.length + ")");
    r.onclick = () => { const items = S.wrong.map(id => DATA[id]); S.order = S.order; startSession(items); };
    act.appendChild(r);
  }
  const again = el("button", "btn primary", "Qayta boshlash");
  again.onclick = () => startSession(filtered());
  act.appendChild(again);
  card.appendChild(act);
  stage.appendChild(card);
}

/* ---------- KARTOCHKA rejimi ---------- */
function renderFlash(stage){
  const d = S.pool[S.pos];
  const meta = el("div", "meta");
  meta.appendChild(el("span", null, (S.pos + 1) + " / " + S.pool.length));
  meta.appendChild(el("span", null, "Bilib oldim: " + S.known.size + " / " + new Set(S.pool.map(x => x.i)).size));
  stage.appendChild(meta);
  progress(stage, S.pos, S.pool.length);

  const card = el("div", "card");
  card.appendChild(el("span", "tag", d.t));
  card.appendChild(el("p", "q", d.q));
  if (!S.revealed){
    const act = el("div", "actions");
    const show = el("button", "btn primary", "Javobni ko'rish");
    show.onclick = () => { S.revealed = true; render(); };
    act.appendChild(show);
    card.appendChild(act);
  } else {
    const ans = el("div", "answer");
    ans.appendChild(el("div", "lbl", "To'g'ri javob"));
    ans.appendChild(el("div", "txt", d.o[d.a]));
    card.appendChild(ans);
    const act = el("div", "actions");
    const again = el("button", "btn again", "Yana qaytaraman");
    again.onclick = () => flashAgain();
    const known = el("button", "btn good", "Bilib oldim");
    known.onclick = () => flashKnown();
    act.appendChild(again); act.appendChild(known);
    card.appendChild(act);
  }
  stage.appendChild(card);
}

function flashKnown(){
  const d = S.pool[S.pos];
  S.known.add(d.i);
  S.wrong = S.wrong.filter(id => id !== d.i);
  S.pos++; S.revealed = false; render();
}
function flashAgain(){
  const d = S.pool[S.pos];
  if (!S.wrong.includes(d.i)) S.wrong.push(d.i);
  S.pool.push(d);           // kartochka navbat oxiriga qaytariladi
  S.pos++; S.revealed = false; render();
}

function renderFlashSummary(stage){
  const uniq = new Set(S.pool.map(x => x.i)).size;
  const card = el("div", "card sum");
  card.appendChild(el("div", null, "Kartochkalar tugadi"));
  card.appendChild(el("div", "big", S.known.size + " / " + uniq));
  card.appendChild(el("div", "pct", "bilib olingan"));
  const act = el("div", "actions");
  if (S.wrong.length){
    const r = el("button", "btn again", "Qaytariladigan kartochkalar (" + S.wrong.length + ")");
    r.onclick = () => startFlashRetry();
    act.appendChild(r);
  }
  const again = el("button", "btn primary", "Qayta boshlash");
  again.onclick = () => startSession(filtered());
  act.appendChild(again);
  card.appendChild(act);
  stage.appendChild(card);
}
function startFlashRetry(){
  const items = S.wrong.map(id => DATA[id]);
  startSession(items);
}

/* ---------- Boshqaruv ---------- */
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => { S.mode = b.dataset.mode; startSession(filtered()); });
document.querySelectorAll("#orderSeg button").forEach(b => b.onclick = () => { S.order = b.dataset.order; startSession(filtered()); });

$("#theme").onclick = () => {
  const h = document.documentElement;
  const dark = h.classList.contains("dark") || (!h.classList.contains("light") && matchMedia("(prefers-color-scheme: dark)").matches);
  h.classList.toggle("dark", !dark); h.classList.toggle("light", dark);
  $("#theme").textContent = dark ? "🌙" : "☀️";
};
(function initTheme(){
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  $("#theme").textContent = dark ? "☀️" : "🌙";
})();

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (S.done) return;
  const k = e.key;
  if (S.mode === "test"){
    if (!S.answered && /^[1-9]$/.test(k) && S.opts[+k - 1]) pickTest(+k - 1);
    else if (S.answered && (k === "Enter" || k === "ArrowRight")) nextTest();
  } else {
    if (!S.revealed && (k === " " || k === "Enter")){ e.preventDefault(); S.revealed = true; render(); }
    else if (S.revealed && k === "1") flashKnown();
    else if (S.revealed && k === "2") flashAgain();
  }
});

startSession(filtered());
</script>
</body>
</html>
